<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لفروحة 💗</title>
<style>
  :root{
    --bg1:#ffe3ec; --bg2:#ffd1e0; --card:#ffffff; --text:#4a2b3a;
    --accent:#e0507e; --accent-dark:#c53868; --muted:#9b7285;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Tahoma','Segoe UI',sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top,0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
    color:var(--text);
    position:relative;
    overflow:hidden;
  }
  .heart-fall{
    position:fixed;
    top:-10%;
    font-size:1.5rem;
    color:var(--accent);
    opacity:0.7;
    pointer-events:none;
    animation:fall linear infinite;
    z-index:0;
  }
  @keyframes fall{
    to{ transform:translateY(115vh) rotate(20deg); }
  }
  .card{ position:relative; z-index:1; }
  .card{
    background:var(--card);
    border-radius:24px;
    padding:36px 28px;
    max-width:400px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 50px rgba(197,56,104,0.18);
  }
  h1{font-size:1.4rem;margin:0 0 6px;color:var(--accent-dark);}
  p{line-height:1.7;margin:10px 0;}
  .hint{
    font-size:0.9rem;color:var(--muted);
    background:#fff3f7;border-radius:12px;padding:10px 14px;margin:16px 0;
  }
  input{
    width:100%;padding:14px;border-radius:14px;border:2px solid #ffd1e0;
    text-align:center;font-size:1.3rem;letter-spacing:6px;margin-top:10px;
    outline:none;
  }
  input:focus{border-color:var(--accent);}
  button{
    margin-top:16px;width:100%;padding:14px;border:none;border-radius:14px;
    background:var(--accent);color:#fff;font-size:1.05rem;cursor:pointer;
    transition:background .2s;
  }
  button:hover{background:var(--accent-dark);}
  .error{color:var(--accent-dark);font-size:0.85rem;height:18px;margin-top:8px;}
  #reveal{display:none;}
  #reveal h1{font-size:1.6rem;}
  .hearts{font-size:1.8rem;margin:6px 0;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg1:#3a1c2a;--bg2:#2a1420;--card:#3c1f2e;--text:#ffe3ec;
      --accent:#ff6f9c;--accent-dark:#ff8db3;--muted:#d99fb4;
    }
    .hint{background:#4a2436;}
    input{background:#2a1420;color:#ffe3ec;border-color:#5c2f42;}
  }
</style>
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ar_AR">
  <meta property="og:url" content="https://made-specialy.github.io/TO-FARAH/">
  <meta property="og:title" content="لفروحة 💗">
  <meta property="og:description" content="ل فروحة 💗 — صفحة مفتوحة برقم مميز محدش يعرفه، لازم تعرف الرقم الصح عشان تفتحها.">
  <meta property="og:image" content="https://made-specialy.github.io/TO-FARAH/og.jpg">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta property="og:image:alt" content="لفروحة 💗">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="لفروحة 💗">
  <meta name="twitter:description" content="ل فروحة 💗 — صفحة مفتوحة برقم مميز محدش يعرفه، لازم تعرف الرقم الصح عشان تفتحها.">
  <meta name="twitter:image" content="https://made-specialy.github.io/TO-FARAH/og.jpg">
</head>
<body>
  <div id="hearts-bg"></div>
  <div class="card" id="lock">
    <h1>في انتظارك يا فروحة</h1>
    <p>الصفحة دي مقفولة برقم مميز محدش يعرفه غيرنا، لازم تعرفي الرقم الصح عشان تفتحيها!</p>
    <input id="code" type="text" inputmode="numeric" placeholder="اكتبي الكود هنا" maxlength="10">
    <button onclick="checkCode()">افتحي الصفحة</button>
    <div class="error" id="err"></div>
    <button type="button" onclick="showHint()" style="background:#fff3f7;color:var(--accent-dark);border:2px solid #ffd1e0;margin-top:10px;">اظهري التلميح</button>
    <div class="hint" id="hint" style="display:none;">تلميح: أول يوم اتكلمنا فيه</div>
  </div>

  <div class="card" id="reveal">
    <h1>أسبوع من أحلى الأيام</h1>
    <p>بقالنا أسبوع بنعرف بعض يا فروحة، وكل يوم فيه كان أحلى من اللي قبله.</p>
    <p>مبسوط إني عرفتك، ومبسوط إني بقى عندي حد زيك في حياتي.</p>
    <p style="margin-top:20px;font-weight:bold;color:var(--accent-dark);">كل أسبوع وانتي طيبة</p>
  </div>

<script>
(function(){
  const container = document.getElementById('hearts-bg');
  const count = 40;
  for(let i=0;i<count;i++){
    const h = document.createElement('div');
    h.className = 'heart-fall';
    h.textContent = '♥';
    h.style.left = Math.random()*100 + 'vw';
    h.style.animationDuration = (6 + Math.random()*6) + 's';
    h.style.animationDelay = (Math.random()*8) + 's';
    h.style.fontSize = (1 + Math.random()*1.3) + 'rem';
    h.style.opacity = 0.3 + Math.random()*0.4;
    container.appendChild(h);
  }
})();
function showHint(){
  document.getElementById('hint').style.display='block';
}
function checkCode(){
  const val = document.getElementById('code').value.trim();
  const err = document.getElementById('err');
  if(val === '1809'){
    document.getElementById('lock').style.display='none';
    document.getElementById('reveal').style.display='block';
  } else {
    err.textContent = 'كود غلط.. فكري تاني';
  }
}
document.getElementById('code').addEventListener('keydown', function(e){
  if(e.key === 'Enter') checkCode();
});
</script>
</body>
</html>
